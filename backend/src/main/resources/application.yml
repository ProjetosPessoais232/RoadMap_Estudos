server:
  port: 8080

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/roadmap}
    username: ${DATABASE_USER:roadmap}
    password: ${DATABASE_PASSWORD:roadmap}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  timeout-seconds: 30

jwt:
  secret: ${JWT_SECRET:roadmap-estudos-dev-secret-change-me-32b}
  expiration-ms: 86400000
